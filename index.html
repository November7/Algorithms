<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Interaktywne symulacje znanych algorytmów.">
    <title>AlgorithmsLab</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <a class="brand" href="index.html">AlgorithmsLab</a>
      </header>
      <section class="intro">
        <div>
          <h1>Algorytmy krok po kroku.</h1>
          <p>Zbiór interaktywnych symulacji znanych algorytmów.</p>
        </div>
      </section>
      <section class="panel">
        <h2 class="section-label">Spis treści</h2>
        <ul id="algorithmIndex"><li>Ładowanie…</li></ul>
      </section>
    </main>
    <script>
      fetch('algorithms.json')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(items => {
          const list = document.getElementById('algorithmIndex');
          list.replaceChildren(...items.map(item => {
            const li = document.createElement('li');
            if (item.status === 'published' && item.url) {
              const a = document.createElement('a');
              a.href = item.url;
              a.textContent = item.title;
              li.append(a);
            } else {
              li.append(item.title + ' (planowane)');
            }
            if (item.status === 'published' && item.description) li.append(' - ' + item.description);
            return li;
          }));
        })
        .catch(() => {
          document.getElementById('algorithmIndex').innerHTML =
            '<li>Nie udało się wczytać listy. Otwórz stronę przez serwer HTTP lub GitHub Pages.</li>';
        });
    </script>
  </body>
</html>
